name: Tests

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    # Tidak memakai secret apa pun: Supabase diganti klien tiruan di dalam
    # tes (folder tests/).
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # @noble/curves dan @noble/hashes, versi eksak dari package-lock.json
      # (dengan hash integritas). npm ci gagal kalau lockfile dan
      # package.json tidak cocok, jadi versinya tidak bisa berubah diam-diam.
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax check scripts
        run: for f in scripts/*.js tests/*.js; do node --check "$f"; done

      - name: Run tests
        run: node --test
