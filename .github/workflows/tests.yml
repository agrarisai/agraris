name: Tests

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    # Tidak memakai secret apa pun: Supabase diganti klien tiruan di dalam
    # tes (folder tests/).
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check scripts
        run: for f in scripts/*.js tests/*.js; do node --check "$f"; done

      - name: Run tests
        run: node --test
