name: Live check

on:
  schedule:
    # Setiap 6 jam (menit 17 supaya tidak bertabrakan dengan jadwal :00)
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

# Jangan sampai dua run menulis kolom live_* bersamaan.
concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: ubuntu-latest
    # Hanya membaca/menulis Supabase lewat REST; tidak ada yang di-commit.
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Tanpa npm install: skrip hanya memakai modul bawaan Node dan
      # scripts/review-lib.js.
      - name: Check demo URLs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/live-check.js

      # Bukti "contract owner signature" hanya berlaku selama owner()
      # kontrak masih sama dengan penanda tangan (scripts/owner-proof.js).
      # Bukti dihapus kalau owner berubah. RPC yang gagal tidak menghapus
      # apa pun.
      - name: Re-check owner signatures
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ROBINHOOD_CHAIN_RPC_URL: ${{ secrets.ROBINHOOD_CHAIN_RPC_URL }}
        run: node scripts/owner-proof.js recheck
