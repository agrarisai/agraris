name: Generate feeds

on:
  schedule:
    # Setiap hari jam 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  generate-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Generate rss.xml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-rss.js

      - name: Generate sitemap.xml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-sitemap.js

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- rss.xml sitemap.xml; then
            echo "No changes to rss.xml or sitemap.xml"
            exit 0
          fi
          git add rss.xml sitemap.xml
          git commit -m "chore: update rss.xml and sitemap.xml [skip ci]"
          git push origin HEAD:main
